services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      LUMEN_SERVER_DATABASE_URL: postgresql+psycopg://lumen:lumen@db:5432/lumen
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: lumen
      POSTGRES_DB: lumen
    ports:
      - "5432:5432"
    volumes:
      - lumen_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumen"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lumen_db_data:
